name: campaignhub-domxss

services:
  panel:
    build: ./panel
    environment:
      FLAG1: "${FLAG1:-FLAG{postmessage_without_origin_check}}"
      FLAG2: "${FLAG2:-FLAG{session_riding_via_dom_xss}}"
      FLAG3: "${FLAG3:-FLAG{stored_xss_widget_preview}}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-Admin!2024}"
      VIEWER_PASSWORD: "${VIEWER_PASSWORD:-viewer123}"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  waf:
    build: ./waf
    ports:
      - "${WAF_PORT:-8080}:8080"
    environment:
      # browser-facing panel origin port (Referer allow-list)
      WAF_PORT: "${WAF_PORT:-8080}"
    depends_on:
      panel:
        condition: service_healthy
    networks:
      - internal

  attacker:
    build:
      context: .
      dockerfile: attacker/Dockerfile
    ports:
      - "${ATTACKER_PORT:-8000}:8000"
    networks:
      - internal

networks:
  internal:
    driver: bridge
